# SIH26168 Intelligent Dead Reckoning - MVP configuration.
# Every experiment reads this file; override with --config or --set key=value.

seed: 7

data:
  root: data/iovnbd                 # populated by `python -m src.download_data`
  cache: data/cache                 # standardised drives (pickle), safe to delete
  manifest: configs/iovnbd_manifest.csv
  # Where GNSS measurements come from while GNSS is *healthy* (outside blackout):
  #   vehicle - the car's reference receiver, time-aligned to the phone IMU (default)
  #   phone   - the smartphone's own GPS fix (its clock drifts by seconds in IO-VNBD)
  # Inside a blackout neither is visible to the estimator; the vehicle track is truth.
  gnss_source: vehicle
  max_gap_s: 1.0                    # split a drive into sessions at IMU gaps longer than this
  sync:
    segment_s: 600                  # piecewise lag estimation segment length
    max_lag_s: 15.0                 # search +/- this many seconds around the nominal offset
    min_corr: 0.5                   # segments below this gyro/yaw-rate correlation are unlabelled
    lowpass_hz: 0.5
  # Phone column mapping. The IO-VNBD header names the gyro axes Yaw/Pitch/Roll, but
  # the data shows the "Pitch" column is the rotation rate about the phone's z axis
  # (correlation 0.93-1.0 with the car's yaw-rate sensor, phone lying flat).
  # The two horizontal axes could not be disambiguated, so the pipeline only uses
  # their rotation-invariant magnitude.
  gyro_columns:
    x: "GYROSCOPE Roll (rad/s)"
    y: "GYROSCOPE Yaw (rad/s)"
    z: "GYROSCOPE Pitch (rad/s)"

split:                              # by complete drive, never by row
  # Y1 (driver D) is excluded: its phone and vehicle logs never correlate, so it has no labels.
  # Drives with little or no label coverage contribute nothing and are simply skipped.
  train: [S2, S3a, S3b, S4,
          Vw4, Vw2, Vfa02, Vta1a, Vw14c, Vta2, Vw11, Vta28, Vta8, Vw3, Vta30, Vta29, Vta17,
          Vtb3, Vta21, Vta22, Vta24, Vta1b, Vw5, Vw6, Vta11, Vta25, Vta7, Vw9, Vtb12, Vta5]
  val: [S3c, Vta16, Vfa01]
  test: [S1, M]                     # S1: unseen drive of a training driver (A); M: unseen driver (B)

preprocess:
  lowpass_hz: 2.0                   # causal 2nd-order Butterworth; keeps braking/turn dynamics
  acc_clip: 12.0                    # m/s^2, per-axis spike clipping (vehicle frame, gravity removed)
  gyro_clip: 2.5                    # rad/s
  stationary_acc_std: 0.12          # m/s^2 rolling std threshold for "stationary"
  stationary_gyro_std: 0.02         # rad/s
  stationary_gyro_max: 0.03         # rad/s mean |gyro| (a steady turn is not "stationary")
  stationary_window_s: 1.0
  calib_max_s: 600                  # at most this much pre-blackout data for alignment/bias

model:
  type: gru                         # gru | tcn
  window: 50                        # samples (5 s at 10 Hz)
  hidden: 64
  layers: 1
  features: [a_f, a_l, a_u, w_u, w_h]
  target: speed                     # forward speed at the last sample of the window
  stride: 3                         # window stride when building the training set
  epochs: 12
  batch_size: 512
  lr: 0.002
  nll_after_epoch: 4                # switch Huber -> Gaussian NLL (uncertainty) after this epoch
  path: outputs/models/motionnet.pt

filter:
  sigma_acc: 0.5                    # m/s^2 process noise on vehicle-frame acceleration
  sigma_gyro: 0.02                  # rad/s process noise on yaw rate
  sigma_ba_rw: 0.005                # accel bias random walk (m/s^2/sqrt(s))
  sigma_bg_rw: 0.0005               # gyro bias random walk (rad/s/sqrt(s))
  gnss_pos_sigma: 3.0               # m
  gnss_speed_sigma: 0.3             # m/s
  gnss_heading_sigma_deg: 3.0
  gnss_heading_min_speed: 3.0       # m/s; course-over-ground is meaningless when slow
  gnss_gate_chi2: 13.8              # 2 dof, 99.9 %
  gnss_timeout_s: 1.5               # no fix for longer than this -> DEAD RECKONING mode
  reacq_inflation: 25.0             # R multiplier right after GNSS returns ...
  reacq_tau_s: 3.0                  # ... decaying with this time constant
  reacq_force_after: 5              # accept GNSS after this many consecutive gated rejections
  nhc_sigma: 0.15                   # m/s soft lateral-velocity constraint (motorcycles: ~1.0)
  motion_sigma_floor: 0.3           # m/s minimum MotionNet pseudo-measurement std
  motion_sigma_scale: 1.5           # scale on predicted std (calibrated on validation drives)
  motion_every: 1                   # run MotionNet every N IMU samples at 10 Hz
  freeze_bias_in_dr: true           # NHC / MotionNet updates may not re-estimate IMU biases
  display_blend_s: 3.0              # displayed position eases onto GNSS corrections over ~this time

map:
  enabled: true                     # one flag turns map matching off for ablation
  osm_path: null                    # Overpass JSON / .osm XML / GeoJSON; null -> trace map
  radius_m: 30.0
  sigma_across_m: 4.0
  heading_gate_deg: 35.0
  heading_sigma_deg: 6.0
  continuity_bonus: 1.5
  max_score: 6.0
  ambiguity_margin: 2.0             # skip when a differently-oriented road scores within this margin
  branch_angle_deg: 20.0
  every: 5                          # attempt a match every N IMU samples
  trace_spacing_m: 8.0              # for the trace-derived road proxy

evaluate:
  durations_s: [30, 60, 120]
  windows_per_duration: 6
  warmup_s: 300                     # GNSS-aided run-in before the blackout (also the calibration data)
  post_s: 30                        # GNSS reacquisition after the blackout
  min_distance_m: 100               # skip windows where the car barely moves
  max_stationary_frac: 0.5
  output_dir: outputs
